name: SCA Scan with Trivy (main branch)

on:
  push:
    branches: [ main, secure ]
  pull_request:
    branches: [ main, secure ]

jobs:
  scan:
    name: Trivy SCA Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Cosign pinned version
        env:
          COSIGN_VERSION: "3.1.1"
        run: |
          set -euo pipefail

          wget -q "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign

          cosign version

      - name: Install Trivy pinned and verified
        env:
          TRIVY_VERSION: "0.71.2"
        run: |
          set -euo pipefail

          ASSET="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          wget -q "${BASE_URL}/${ASSET}"
          wget -q "${BASE_URL}/${ASSET}.sigstore.json"

          cosign verify-blob "${ASSET}" \
            --bundle "${ASSET}.sigstore.json" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity="https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}"

          tar -xzf "${ASSET}"
          sudo install -m 0755 trivy /usr/local/bin/trivy

          trivy --version

      - name: Run Trivy SCA scan and generate SARIF
        run: |
          set -euo pipefail
          trivy fs --scanners vuln . --severity CRITICAL --exit-code 1
